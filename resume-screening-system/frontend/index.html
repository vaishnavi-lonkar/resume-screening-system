<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shortlist – Resume Screening System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="rail" aria-label="Jobs">
      <h1 class="brand">Shortlist</h1>
      <button id="newJobBtn" class="btn primary" type="button">New job</button>
      <ul id="jobList" class="joblist"></ul>
    </aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
