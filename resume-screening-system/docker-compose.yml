services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: screener
      POSTGRES_PASSWORD: screener
      POSTGRES_DB: resume_screening
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screener"]
      interval: 5s
      retries: 10
  web:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg2://screener:screener@db:5432/resume_screening
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
